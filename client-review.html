<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Website Review · Bonebrake Web Design</title>
  <style>
    :root{--ink:#171714;--paper:#f1ede5;--card:#fbf8f1;--line:#d8d0c3;--muted:#6d665d;--bronze:#8a6b45;--ok:#315e46;--bad:#7a3128}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}
    header{height:74px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(251,248,241,.95);position:sticky;top:0;z-index:5}.brand{font:600 13px/1 Georgia,serif;letter-spacing:.16em;text-transform:uppercase}.meta{font-size:12px;color:var(--muted)}
    main{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:calc(100vh - 74px)}.preview{background:#d8d2c8;padding:18px}.frame{height:calc(100vh - 110px);min-height:620px;width:100%;border:0;border-radius:18px;background:white;box-shadow:0 22px 70px rgba(23,23,20,.16)}
    aside{border-left:1px solid var(--line);background:var(--card);padding:30px 26px;display:flex;flex-direction:column;gap:24px}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--bronze);font-weight:750}.title{font:500 30px/1.04 Georgia,serif;letter-spacing:-.03em;margin:10px 0}.copy{font-size:14px;line-height:1.65;color:var(--muted);margin:0}.status{padding:12px 14px;border:1px solid var(--line);border-radius:14px;font-size:12px;line-height:1.5;color:var(--muted)}.status strong{display:block;color:var(--ink);margin-bottom:2px}.status.ok{border-color:#aec8b8;background:#f3faf6}.status.bad{border-color:#d9b9b2;background:#fff4f2;color:var(--bad)}
    .actions{display:grid;gap:10px}.btn{appearance:none;border:0;border-radius:999px;padding:14px 18px;font:650 14px/1 inherit;cursor:pointer}.primary{background:var(--ink);color:white}.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}
    .revision{display:none;gap:10px}.revision.open{display:grid}textarea{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);background:#fffdf8;border-radius:14px;padding:13px 14px;font:14px/1.55 inherit;color:var(--ink);outline:none}textarea:focus{border-color:var(--bronze);box-shadow:0 0 0 3px rgba(138,107,69,.12)}.fine{font-size:11px;line-height:1.55;color:var(--muted)}
    .loading{padding:80px 24px;text-align:center;color:var(--muted)}
    @media(max-width:900px){header{position:relative}.meta{display:none}main{grid-template-columns:1fr}.preview{padding:10px}.frame{height:68vh;min-height:520px;border-radius:14px}aside{border-left:0;border-top:1px solid var(--line);padding:26px 20px 42px}}
  </style>
</head>
<body>
<header><div class="brand">Bonebrake Web Design</div><div class="meta">Private client review · Do not forward this link</div></header>
<main id="app"><div class="loading">Opening your private website review…</div></main>
<script>
(()=>{
  'use strict';
  const API='https://usurytofnhhfxxipngdd.supabase.co/functions/v1/project-review';
  const app=document.getElementById('app');
  const params=new URLSearchParams(location.search);
  let token=params.get('t')||sessionStorage.getItem('bonebrakeReviewToken')||'';
  async function call(payload){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),referrerPolicy:'no-referrer'});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok!==true){const e=new Error(d.error||'request_failed');e.status=r.status;throw e}return d}
  function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function showError(message){app.innerHTML=`<div class="loading"><strong>Review unavailable.</strong><br><br>${escapeHtml(message)}</div>`}
  async function init(){
    if(!token){showError('This private review link is incomplete. Please use the full link from Bonebrake Web Design.');return}
    try{
      const data=await call({token,action:'read'});
      sessionStorage.setItem('bonebrakeReviewToken',token);if(location.search)history.replaceState(null,'',location.pathname);
      const qa=data.qa?.passed===true;
      app.innerHTML=`<section class="preview"><iframe class="frame" title="Website preview" referrerpolicy="no-referrer" sandbox="allow-scripts" src="${escapeHtml(data.preview_url)}"></iframe></section><aside><div><div class="eyebrow">Website preview · Version ${escapeHtml(data.artifact?.version)}</div><h1 class="title">${escapeHtml(data.project?.client_name||'Your website')}</h1><p class="copy">Review the design, wording, hierarchy, and overall direction. Nothing on this page is published to your production domain.</p></div><div class="status ${qa?'ok':'bad'}"><strong>${qa?'Quality checks passed':'Quality review incomplete'}</strong>${qa?'This preview has passed Bonebrake’s automated structural and safety checks.':'Approval is disabled until quality checks pass.'}</div><div class="actions"><button class="btn primary" id="approve" ${qa?'':'disabled'}>Approve this website</button><button class="btn secondary" id="changes">Request changes</button></div><div class="revision" id="revision"><textarea id="feedback" maxlength="12000" placeholder="Describe exactly what you want changed. You can mention sections, wording, layout, style, colors, or anything else you noticed."></textarea><button class="btn primary" id="submitChanges">Send revision request</button><button class="btn secondary" id="cancelChanges">Cancel</button></div><div class="status" id="message"><strong>Private review</strong>Your feedback is attached to this exact preview version. A new version will be generated rather than silently changing the one you approved.</div><div class="fine">Approval does not publish the website. Bonebrake’s owner release approval and production deployment gate remain separate.</div></aside>`;
      bind();
    }catch(e){showError(e.message==='review_expired'?'This review link has expired. Please request a fresh preview link.':'We could not validate this private review link.')}
  }
  function bind(){
    const revision=document.getElementById('revision'),message=document.getElementById('message');
    document.getElementById('changes').onclick=()=>revision.classList.add('open');
    document.getElementById('cancelChanges').onclick=()=>revision.classList.remove('open');
    document.getElementById('submitChanges').onclick=async()=>{const text=document.getElementById('feedback').value.trim();if(!text){message.className='status bad';message.innerHTML='<strong>Tell us what to change.</strong>Please add at least one specific revision request.';return}const btn=document.getElementById('submitChanges');btn.disabled=true;btn.textContent='Sending…';try{await call({token,action:'request_revision',request_text:text});message.className='status ok';message.innerHTML='<strong>Revision request received.</strong>Your requested changes are now in the Bonebrake revision queue.';revision.classList.remove('open');document.getElementById('approve').disabled=true;document.getElementById('changes').disabled=true}catch{message.className='status bad';message.innerHTML='<strong>Could not submit changes.</strong>Please try again.';btn.disabled=false;btn.textContent='Send revision request'}};
    document.getElementById('approve').onclick=async()=>{if(!confirm('Approve this website version? This will send it to Bonebrake for final owner release approval.'))return;const btn=document.getElementById('approve');btn.disabled=true;btn.textContent='Approving…';try{await call({token,action:'approve'});sessionStorage.removeItem('bonebrakeReviewToken');message.className='status ok';message.innerHTML='<strong>Website approved.</strong>Bonebrake has your approval. The site still cannot publish until final release checks and owner approval are complete.';document.getElementById('changes').disabled=true;btn.textContent='Approved'}catch(e){message.className='status bad';message.innerHTML=`<strong>Approval could not be recorded.</strong>${escapeHtml(e.message==='revision_pending'?'A revision request is still pending.':'Please try again or contact Bonebrake Web Design.')}`;btn.disabled=false;btn.textContent='Approve this website'}};
  }
  init();
})();
</script>
</body>
</html>
