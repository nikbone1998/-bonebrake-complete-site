<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Website Review · Bonebrake Web Design</title><style>:root{--ink:#171714;--paper:#f1ede5;--card:#fbf8f1;--line:#d8d0c3;--muted:#6d665d;--bronze:#8a6b45;--ok:#315e46;--bad:#7a3128}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(251,248,241,.95)}.brand{font:600 13px/1 Georgia,serif;letter-spacing:.16em;text-transform:uppercase}.meta{font-size:12px;color:var(--muted)}main{display:grid;grid-template-columns:minmax(0,1fr) 370px;min-height:calc(100vh - 74px)}.preview{background:#d8d2c8;padding:18px}.frame{height:calc(100vh - 110px);min-height:620px;width:100%;border:0;border-radius:18px;background:white;box-shadow:0 22px 70px rgba(23,23,20,.16)}aside{border-left:1px solid var(--line);background:var(--card);padding:30px 26px;display:flex;flex-direction:column;gap:20px}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--bronze);font-weight:750}.title{font:500 30px/1.04 Georgia,serif;letter-spacing:-.03em;margin:10px 0}.copy{font-size:14px;line-height:1.65;color:var(--muted)}.status{padding:12px 14px;border:1px solid var(--line);border-radius:14px;font-size:12px;line-height:1.5;color:var(--muted)}.status strong{display:block;color:var(--ink)}.status.ok{border-color:#aec8b8;background:#f3faf6}.status.bad{border-color:#d9b9b2;background:#fff4f2;color:var(--bad)}.actions,.revision{display:grid;gap:10px}.revision{display:none}.revision.open{display:grid}.btn{appearance:none;border:0;border-radius:999px;padding:14px 18px;font:650 14px/1 inherit;cursor:pointer}.primary{background:var(--ink);color:white}.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}textarea{width:100%;min-height:175px;resize:vertical;border:1px solid var(--line);background:#fffdf8;border-radius:14px;padding:13px 14px;font:14px/1.55 inherit}.fine{font-size:11px;line-height:1.55;color:var(--muted)}.loading{padding:80px 24px;text-align:center;color:var(--muted)}@media(max-width:900px){.meta{display:none}main{grid-template-columns:1fr}.preview{padding:10px}.frame{height:68vh;min-height:520px}aside{border-left:0;border-top:1px solid var(--line)}}</style></head><body><header><div class="brand">Bonebrake Web Design</div><div class="meta">Private client review · Do not forward this link</div></header><main id="app"><div class="loading">Opening your private website review…</div></main><script>(()=>{'use strict';const API='https://usurytofnhhfxxipngdd.supabase.co/functions/v1/project-review',app=document.getElementById('app'),params=new URLSearchParams(location.search);let token=params.get('t')||sessionStorage.getItem('bonebrakeReviewToken')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function call(payload){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),referrerPolicy:'no-referrer'}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok!==true){const e=new Error(d.error||'request_failed');e.status=r.status;e.data=d;throw e}return d}function error(m){app.innerHTML=`<div class="loading"><strong>Review unavailable.</strong><br><br>${esc(m)}</div>`}async function init(){if(!token)return error('This private review link is incomplete.');try{const d=await call({token,action:'read'});sessionStorage.setItem('bonebrakeReviewToken',token);if(location.search)history.replaceState(null,'',location.pathname);const qa=d.qa?.passed===true,p=d.revision_policy||{},remaining=Number(p.remaining_rounds??0),open=!!p.open_round,canRequest=!open&&remaining>0;app.innerHTML=`<section class="preview"><iframe class="frame" title="Website preview" referrerpolicy="no-referrer" sandbox="allow-scripts" src="${esc(d.preview_url)}"></iframe></section><aside><div><div class="eyebrow">Website preview · Version ${esc(d.artifact?.version)}</div><h1 class="title">${esc(d.project?.client_name||'Your website')}</h1><p class="copy">Review the design, wording, hierarchy, and overall direction. Nothing here is published to your production domain.</p></div><div class="status ${qa?'ok':'bad'}"><strong>${qa?'Quality checks passed':'Quality review incomplete'}</strong>${qa?'This preview passed Bonebrake’s structural and safety checks.':'Approval remains disabled until QA passes.'}</div><div class="status"><strong>Included revisions: ${esc(p.used_rounds??0)} of ${esc(p.included_rounds??2)} used</strong>${open?'A revision round is already being processed.':remaining>0?`${remaining} consolidated revision round${remaining===1?'':'s'} remaining. Send one organized batch of changes per round.`:'The included revision rounds have been used. New-scope or additional revision work requires a separate quote.'}</div><div class="actions"><button class="btn primary" id="approve" ${qa&&!open?'':'disabled'}>Approve this website</button><button class="btn secondary" id="changes" ${canRequest?'':'disabled'}>Request changes</button></div><div class="revision" id="revision"><textarea id="feedback" maxlength="12000" placeholder="Send one consolidated batch for this round. Include every wording, section, layout, style, or color change you want us to address together."></textarea><button class="btn primary" id="submitChanges">Send consolidated revision round</button><button class="btn secondary" id="cancelChanges">Cancel</button></div><div class="status" id="message"><strong>Private review</strong>Your feedback is attached to this exact preview version. A new version is generated rather than silently altering the version you reviewed.</div><div class="fine">Approval does not publish the website. Owner release approval and production deployment remain separate.</div></aside>`;bind()}catch(e){error(e.message==='review_expired'?'This review link has expired. Please request a fresh preview link.':'We could not validate this private review link.')}}function bind(){const revision=document.getElementById('revision'),message=document.getElementById('message'),changes=document.getElementById('changes'),approve=document.getElementById('approve');changes.onclick=()=>revision.classList.add('open');document.getElementById('cancelChanges').onclick=()=>revision.classList.remove('open');document.getElementById('submitChanges').onclick=async()=>{const text=document.getElementById('feedback').value.trim();if(!text){message.className='status bad';message.innerHTML='<strong>Consolidate your feedback first.</strong>Add the full batch of changes you want included in this revision round.';return}const btn=document.getElementById('submitChanges');btn.disabled=true;btn.textContent='Sending…';try{const d=await call({token,action:'request_revision',request_text:text});message.className='status ok';message.innerHTML=`<strong>Revision round received.</strong>${esc(d.revision_policy?.remaining_rounds??0)} included round(s) remain after this one.`;revision.classList.remove('open');approve.disabled=true;changes.disabled=true}catch(e){message.className='status bad';message.innerHTML=e.message==='revision_pending'?'<strong>A revision is already open.</strong>Wait for the next preview before sending more feedback.':e.message==='revision_limit_reached'?'<strong>Included revision rounds are complete.</strong>Additional or new-scope work needs a separate quote.':'<strong>Could not submit changes.</strong>Please try again.';btn.disabled=false;btn.textContent='Send consolidated revision round'}};approve.onclick=async()=>{if(!confirm('Approve this website version and send it to Bonebrake for final release approval?'))return;approve.disabled=true;approve.textContent='Approving…';try{await call({token,action:'approve'});sessionStorage.removeItem('bonebrakeReviewToken');message.className='status ok';message.innerHTML='<strong>Website approved.</strong>Bonebrake has your approval. Final release and production checks remain separate.';changes.disabled=true;approve.textContent='Approved'}catch(e){message.className='status bad';message.innerHTML=`<strong>Approval could not be recorded.</strong>${e.message==='revision_pending'?' A revision is still being processed.':' Please try again.'}`;approve.disabled=false;approve.textContent='Approve this website'}}}init()})();</script></body></html>
