<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Domain Setup · Bonebrake Web Design</title><style>:root{color-scheme:light;--ink:#171713;--muted:#716d64;--line:rgba(23,23,19,.12);--paper:#f4f0e8;--good:#e7f1e9;--warn:#f6ecd5}*{box-sizing:border-box}body{margin:0;background:#eeebe4;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(900px,calc(100% - 32px));margin:0 auto;padding:40px 0 70px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:34px;font-weight:750}.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#171713;color:#fff;font-family:Georgia,serif;font-size:19px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 18px 60px rgba(30,28,23,.07)}.hero{padding:34px 36px;background:linear-gradient(145deg,#fff,var(--paper))}.eyebrow{text-transform:uppercase;letter-spacing:.11em;font-size:10px;font-weight:800;color:var(--muted)}h1{margin:8px 0 12px;font:500 clamp(34px,7vw,64px)/.98 Georgia,"Times New Roman",serif}p{line-height:1.65;color:var(--muted);margin:0}.body{padding:30px 36px 36px}.statusline{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 22px}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:#faf9f6}.pill.good{background:var(--good)}.pill.warn{background:var(--warn)}.notice{padding:16px;border-radius:15px;background:var(--warn);line-height:1.55;font-size:13px}.notice.good{background:var(--good)}.records{margin-top:18px;border:1px solid var(--line);border-radius:16px;overflow:hidden}.record{display:grid;grid-template-columns:85px minmax(110px,.8fr) minmax(160px,1.4fr) 70px;gap:10px;align-items:center;padding:13px 14px;border-top:1px solid var(--line);font-size:12px}.record:first-child{border-top:0}.record code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}.copy{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 8px;cursor:pointer;font-weight:700}.actions{display:flex;gap:10px;align-items:center;margin-top:22px}.btn{border:0;border-radius:999px;padding:12px 17px;background:#171713;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5;cursor:wait}.updated{font-size:11px;color:var(--muted)}.error{padding:16px;border-radius:14px;background:#f2dddd;color:#692929}.hidden{display:none}@media(max-width:680px){.hero,.body{padding:25px 21px}.record{grid-template-columns:65px 1fr}.record code:nth-child(3){grid-column:1/-1}.record .copy{grid-column:2}.actions{align-items:flex-start;flex-direction:column}}</style></head><body><main class="shell"><div class="brand"><span class="mark">B</span><span>Bonebrake Web Design</span></div><section class="card"><div class="hero"><div class="eyebrow">Private client setup</div><h1 id="title">Connecting your domain.</h1><p id="lede">This page verifies the exact DNS and SSL requirements for your website. You will only be shown DNS changes after Bonebrake receives authoritative instructions from the hosting platform.</p></div><div class="body"><div id="error" class="error hidden"></div><div id="content"><div class="statusline" id="states"></div><div id="instructions" class="notice">Checking your domain setup…</div><div id="records" class="records hidden"></div><div class="actions"><button class="btn" id="checkBtn" type="button">Check again</button><span class="updated" id="updated"></span></div></div></div></section></main><script>(()=>{'use strict';const ENDPOINT='https://usurytofnhhfxxipngdd.supabase.co/functions/v1/domain-onboarding',KEY='sb_publishable_jpA7u89wOaxWcyO5NU5cGw_HkQTnOkv';const params=new URLSearchParams(location.search),TOKEN=params.get('token')||'';history.replaceState(null,'',location.pathname);const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let domain=null;function pill(label,value){const v=String(value||'pending'),good=['ready','verified','active','attached'].includes(v);return `<span class="pill ${good?'good':'warn'}">${esc(label)}: ${esc(v.replaceAll('_',' '))}</span>`}function render(){if(!domain)return;$('title').textContent=domain.status==='verified'||domain.status==='active'?`${domain.hostname} is ready.`:`Set up ${domain.hostname}`;$('states').innerHTML=pill('Hosting',domain.host_status)+pill('DNS',domain.dns_status)+pill('SSL',domain.ssl_status);const authoritative=domain.dns_instructions_authoritative===true,reqs=Array.isArray(domain.dns_requirements)?domain.dns_requirements:[];if(!authoritative){$('instructions').className='notice';$('instructions').innerHTML='<strong>No DNS changes are needed from you yet.</strong><br>Bonebrake is preparing and verifying the hosting connection. Please do not guess at records or change your DNS until this page shows the exact requirements.';$('records').classList.add('hidden');$('records').innerHTML=''}else if(domain.status==='verified'||domain.status==='active'){$('instructions').className='notice good';$('instructions').innerHTML='<strong>Your domain is verified and SSL is ready.</strong><br>No additional DNS changes are currently required.';$('records').classList.add('hidden')}else{$('instructions').className='notice';$('instructions').innerHTML='<strong>Update the following DNS records with your domain provider.</strong><br>Use these values exactly. DNS changes can take time to propagate.';$('records').classList.remove('hidden');$('records').innerHTML=reqs.map((r,i)=>`<div class="record"><code>${esc(r.type||'')}</code><code>${esc(r.name||'@')}</code><code>${esc(r.value||'')}</code><button class="copy" type="button" data-copy="${i}">Copy</button></div>`).join('')||'<div class="record"><span>No record changes were returned.</span></div>'}$('updated').textContent=domain.dns_checked_at?`Last checked ${new Date(domain.dns_checked_at).toLocaleString()}`:'Not checked yet'}async function call(action){if(!TOKEN)throw new Error('This private setup link is missing or invalid. Ask Bonebrake Web Design for a fresh link.');const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({action,token:TOKEN})});const data=await r.json().catch(()=>({}));if(!r.ok||data?.ok!==true)throw new Error(data?.detail||data?.error||'Domain setup could not be loaded.');return data.domain}async function load(action='status'){const b=$('checkBtn');b.disabled=true;b.textContent='Checking…';try{domain=await call(action);$('error').classList.add('hidden');$('content').classList.remove('hidden');render()}catch(e){$('content').classList.add('hidden');$('error').classList.remove('hidden');$('error').textContent=e.message||String(e)}finally{b.disabled=false;b.textContent='Check again'}}$('checkBtn').addEventListener('click',()=>load('check'));$('records').addEventListener('click',async e=>{const b=e.target.closest('[data-copy]');if(!b||!domain)return;const r=domain.dns_requirements?.[Number(b.dataset.copy)];if(!r)return;try{await navigator.clipboard.writeText(String(r.value||''));b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200)}catch{}});load('status')})()</script></body></html>
